<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 5 — Array Destructuring: Pick Favorite Fruits</title>
</head>
<body>
  <h2>🍉 Task 5 — Array Destructuring: Pick Favorite Fruits</h2>
  <p>Enter a list of fruits and find out your top picks!</p>

  <input id="fruitsInput" placeholder="e.g. apple, banana, mango, kiwi, cherry" size="60">
  <button id="showBtn">Show Favorites</button>

  <p id="result"></p>

  <script>
    document.getElementById("showBtn").addEventListener("click", () => {
      // Marrim tekstin nga input
      const input = document.getElementById("fruitsInput").value;

      // Ndahet sipas presjeve dhe pastrohen hapsirat
      const fruits = input.split(",").map(f => f.trim()).filter(f => f !== "");

      // Nëse s’ka asnjë frut
      if (fruits.length === 0) {
        document.getElementById("result").textContent = "Ju lutem zgjidhni se paku nje frut!";
        return;
      }

      const [first, second, ...others] = fruits;

      
      let message = "";

      if (fruits.length === 1) {
        message = `I preferuari juaj eshte: ${first}.`;
      } else if (fruits.length === 2) {
        message = `Dy frutet e tuaja te preferuara jane:  ${first} dhe ${second}.`;
      } else {
        message = `Dy frutat e juaja te preferuara jane ${first} dhe ${second}. Te tjerat: ${others.join(", ")}.`;
      }

      document.getElementById("result").textContent = message;
    });
  </script>
</body>
</html>
