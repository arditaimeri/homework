<!DOCTYPE html>
<html>
<head>
    <title>Work 1 - Let Method</title>
    <meta charset="utf-8" />
    <style>
      li {
        font-size: 22px;
      }
      li:hover {
        cursor: pointer;
      }
    </style>
</head>
<body>
<h1>Work 1 - Let Method</h1>

<ul id="list">
    <li>1</li>
    <li>2</li>
    <li>3</li>
    <li>4</li>
    <li>5</li>
</ul>

<script>
const els = document.getElementById("list").getElementsByTagName("li");

for (let i = 0; i < els.length; i++) {
    els[i].onclick = function() {
        alert("Numri i elementit: " + i);
        console.log("Numri i elementit:", i);
    };
}
</script>
</body>
</html>
