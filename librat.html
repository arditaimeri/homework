<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Manager</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100">

  <div id="root"></div>

  <script type="text/babel">

    // Reusable Input Component
    function Input({ label, value, onChange, type = "text", textarea = false }) {
      return (
        <div className="flex flex-col mb-4">
          <label className="font-semibold mb-1">{label}</label>
          {textarea ? (
            <textarea
              value={value}
              onChange={(e) => onChange(e.target.value)}
              className="p-2 rounded-xl bg-gray-100"
            />
          ) : (
            <input
              type={type}
              value={value}
              onChange={(e) => onChange(e.target.value)}
              className="p-2 rounded-xl bg-gray-100"
            />
          )}
        </div>
      );
    }

    // Button component
    function Button({ children, onClick, variant = "default", disabled }) {
      const base = "px-3 py-2 rounded-xl shadow-sm font-semibold";
      const styles = {
        default: "bg-blue-500 text-white",
        danger: "bg-red-500 text-white",
        outline: "border border-gray-400",
      };
      return (
        <button
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${styles[variant]} ${disabled ? "opacity-40 cursor-not-allowed" : ""}`}
        >
          {children}
        </button>
      );
    }

    // Book Component
    function Book({ data, onDelete, onSell, onEdit }) {
      const placeholderImg =
        "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/No_image_available.svg/480px-No_image_available.svg.png";

      const noStock = data.stock === 0;

      return (
        <div className="border p-4 rounded-2xl shadow bg-white flex flex-col gap-3">
          <img
            src={data.image || placeholderImg}
            alt="Book"
            className="w-32 h-32 object-cover rounded-xl"
          />
          <h2 className="text-xl font-bold">{data.name}</h2>
          <p className="text-sm text-gray-600">Autori: {data.author}</p>
          <p className="text-sm">{data.description}</p>

          <p className={`font-semibold ${noStock ? "text-red-500" : "text-green-600"}`}>
            {noStock ? "Nuk ka stok" : `Stoku: ${data.stock}`}
          </p>

          <div className="flex gap-2 mt-2">
            <Button variant="danger" onClick={onDelete}>Fshij</Button>
            <Button variant="outline" onClick={onSell} disabled={noStock}>Shit</Button>
            <Button onClick={onEdit}>Ndrysho</Button>
          </div>
        </div>
      );
    }

    // Main Component - Library Manager
    function LibraryManager() {
      const [name, setName] = React.useState("");
      const [author, setAuthor] = React.useState("");
      const [description, setDescription] = React.useState("");
      const [pages, setPages] = React.useState("");
      const [stock, setStock] = React.useState("");
      const [image, setImage] = React.useState("");

      const [books, setBooks] = React.useState([]);
      const [editIndex, setEditIndex] = React.useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name || !author || !description || !pages || stock === "") {
          alert("Ju lutem plotesoni te gjitha fushat!");
          return;
        }

        const newBook = { name, author, description, pages, stock: Number(stock), image };

        if (editIndex !== null) {
          const updated = [...books];
          updated[editIndex] = newBook;
          setBooks(updated);
          setEditIndex(null);
        } else {
          setBooks([...books, newBook]);
        }

        setName("");
        setAuthor("");
        setDescription("");
        setPages("");
        setStock("");
        setImage("");
      };

      const deleteBook = (index) => {
        setBooks(books.filter((_, i) => i !== index));
      };

      const sellBook = (index) => {
        if (books[index].stock === 0) return;
        const updated = [...books];
        updated[index].stock -= 1;
        setBooks(updated);
      };

      const editBook = (index) => {
        const b = books[index];
        setName(b.name);
        setAuthor(b.author);
        setDescription(b.description);
        setPages(b.pages);
        setStock(b.stock);
        setImage(b.image);
        setEditIndex(index);
      };

      return (
        <div className="p-6 max-w-3xl mx-auto flex flex-col gap-6">
          <h1 className="text-3xl font-bold">Library Manager</h1>

          <form onSubmit={handleSubmit} className="bg-white p-6 shadow rounded-2xl">
            <Input label="Emri" value={name} onChange={setName} />
            <Input label="Autori" value={author} onChange={setAuthor} />
            <Input label="Pershkrimi" textarea value={description} onChange={setDescription} />
            <Input label="Numri i faqeve" type="number" value={pages} onChange={setPages} />
            <Input label="Numri ne stok" type="number" value={stock} onChange={setStock} />
            <Input label="Image URL" value={image} onChange={setImage} />

            <Button>{editIndex !== null ? "Ruaj ndryshimet" : "Shto Librin"}</Button>
          </form>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {books.map((book, index) => (
              <Book
                key={index}
                data={book}
                onDelete={() => deleteBook(index)}
                onSell={() => sellBook(index)}
                onEdit={() => editBook(index)}
              />
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<LibraryManager />);

  </script>

</body>
</html>
